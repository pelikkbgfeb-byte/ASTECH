<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Builder CV - PT Solusi Anugerah Teknologi</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-white">

    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50 border-b border-slate-800">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-slate-300 hover:text-white transition">
                ← Kembali ke Beranda
            </a>
            <h1 class="text-xs sm:text-sm font-extrabold tracking-wider text-emerald-400">PT SOLUSI ANUGRAH TEKNOLOGI</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl space-y-6 no-print border border-slate-100 animate-fade-in">
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Pilih Template CV</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="gantiTemplate(1)" id="btn-t1" class="p-3.5 border-2 border-slate-900 bg-slate-900 text-white font-bold rounded-2xl text-xs cursor-pointer transition-all duration-300 shadow-md">
                        Template 1 (Modern ATS)
                    </button>
                    <button onclick="gantiTemplate(2)" id="btn-t2" class="p-3.5 border-2 border-slate-200 bg-white text-slate-700 font-bold rounded-2xl text-xs cursor-pointer transition-all duration-300 hover:bg-slate-50">
                        Template 2 (Klasik Formal)
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-base font-bold text-slate-800 border-b pb-2">1. Data Diri</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="input-nama" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Posisi yang Dilamar</label>
                        <input type="text" id="input-posisi" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Domisili / Kota</label>
                        <input type="text" id="input-lokasi" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">No. WhatsApp</label>
                        <input type="text" id="input-telp" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                    <input type="email" id="input-email" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tentang Singkat (Profil)</label>
                    <textarea id="input-ringkasan" rows="3" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()"></textarea>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-base font-bold text-slate-800 border-b pb-2">2. Pengalaman & Pendidikan</h3>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pengalaman Kerja / Organisasi (Enter untuk baris baru)</label>
                    <textarea id="input-pengalaman" rows="4" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Pendidikan Terakhir</label>
                    <textarea id="input-pendidikan" rows="2" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()"></textarea>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-base font-bold text-slate-800 border-b pb-2">3. Kemampuan & Keahlian</h3>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kemampuan Umum</label>
                    <input type="text" id="input-skill" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kemampuan Bahasa</label>
                    <input type="text" id="input-bahasa" class="w-full text-sm border border-slate-200 bg-slate-50 rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all" oninput="updateCV()">
                </div>
            </div>

            <button onclick="window.print()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-300 cursor-pointer text-sm flex items-center justify-center gap-2">
                <span>🖨️</span> Simpan sebagai PDF / Cetak CV
            </button>
        </div>

        <div class="flex justify-center">
            <div id="cv-preview" class="bg-white w-full max-w-[210mm] min-h-[297mm] p-10 rounded-3xl shadow-2xl text-slate-900 flex flex-col justify-between box-border font-serif transition-all duration-500">
                <div id="cv-content-area" class="space-y-4 transition-all duration-300">
                    </div>
                <div class="text-center text-[10px] text-slate-400 border-t pt-3 mt-6 font-sans flex justify-between items-center">
                    <span class="font-bold text-slate-600">PT Solusi Anugerah Teknologi</span>
                    <span>AI-Powered ATS Optimized</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        let currentTemplate = 1;

        function gantiTemplate(num) {
            currentTemplate = num;
            let btn1 = document.getElementById('btn-t1');
            let btn2 = document.getElementById('btn-t2');
            let previewArea = document.getElementById('cv-content-area');

            previewArea.style.opacity = '0';
            previewArea.style.transform = 'translateY(8px)';

            setTimeout(() => {
                if (num === 1) {
                    btn1.className = "p-3.5 border-2 border-slate-900 bg-slate-900 text-white font-bold rounded-2xl text-xs cursor-pointer transition-all duration-300 shadow-md";
                    btn2.className = "p-3.5 border-2 border-slate-200 bg-white text-slate-700 font-bold rounded-2xl text-xs cursor-pointer transition-all duration-300 hover:bg-slate-50";
                } else {
                    btn2.className = "p-3.5 border-2 border-slate-900 bg-slate-900 text-white font-bold rounded-2xl text-xs cursor-pointer transition-all duration-300 shadow-md";
                    btn1.className = "p-3.5 border-2 border-slate-200 bg-white text-slate-700 font-bold rounded-2xl text-xs cursor-pointer transition-all duration-300 hover:bg-slate-50";
                }
                updateCV();
                previewArea.style.opacity = '1';
                previewArea.style.transform = 'translateY(0)';
            }, 200);
        }

        function formatList(text) {
            if (!text.trim()) return '';
            let lines = text.split('\n');
            let html = '';
            lines.forEach(line => {
                if (line.trim() !== '') {
                    html += `<p class="animate-fade-in">• &nbsp; ${line.trim()}</p>`;
                }
            });
            return html;
        }

        function updateCV() {
            let nama = document.getElementById('input-nama').value;
            let posisi = document.getElementById('input-posisi').value;
            let lokasi = document.getElementById('input-lokasi').value;
            let telp = document.getElementById('input-telp').value;
            let email = document.getElementById('input-email').value;
            let kontakArr = [lokasi, telp, email].filter(Boolean);
            let kontakStr = kontakArr.join(' | ');

            let ringkasan = formatList(document.getElementById('input-ringkasan').value);
            let pengalaman = formatList(document.getElementById('input-pengalaman').value);
            let pendidikan = formatList(document.getElementById('input-pendidikan').value);
            let skill = document.getElementById('input-skill').value || '-';
            let bahasa = document.getElementById('input-bahasa').value || '-';

            let container = document.getElementById('cv-content-area');

            if (currentTemplate === 1) {
                container.innerHTML = `
                    <div class="text-center border-b-2 border-slate-900 pb-3 animate-fade-in">
                        <h2 class="text-2xl font-bold tracking-wide uppercase">${nama}</h2>
                        <p class="text-xs font-semibold tracking-wider text-slate-700 uppercase mt-0.5">${posisi}</p>
                        <p class="text-[11px] text-slate-600 mt-1">${kontakStr}</p>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-900 border-b border-slate-400 pb-0.5 mb-1.5">Tentang Saya</h3>
                        <div class="text-[11px] text-slate-800 leading-relaxed space-y-1">${ringkasan}</div>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-900 border-b border-slate-400 pb-0.5 mb-1.5">Pengalaman Kerja & Organisasi</h3>
                        <div class="text-[11px] text-slate-800 leading-relaxed space-y-1">${pengalaman}</div>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-900 border-b border-slate-400 pb-0.5 mb-1.5">Pendidikan</h3>
                        <div class="text-[11px] text-slate-800 leading-relaxed space-y-1">${pendidikan}</div>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-900 border-b border-slate-400 pb-0.5 mb-1.5">Keahlian & Bahasa</h3>
                        <div class="text-[11px] text-slate-800 space-y-1">
                            <p><strong>Keahlian:</strong> ${skill}</p>
                            <p><strong>Bahasa:</strong> ${bahasa}</p>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="border-l-4 border-slate-900 pl-3 py-1 animate-fade-in">
                        <h2 class="text-2xl font-bold tracking-wide uppercase">${nama}</h2>
                        <p class="text-xs font-semibold tracking-wider text-slate-700 uppercase">${posisi}</p>
                        <p class="text-[11px] text-slate-600 mt-0.5">${kontakStr}</p>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-900 p-1 mb-1.5">Profil Singkat</h3>
                        <div class="text-[11px] text-slate-800 leading-relaxed space-y-1">${ringkasan}</div>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-900 p-1 mb-1.5">Riwayat Pengalaman</h3>
                        <div class="text-[11px] text-slate-800 leading-relaxed space-y-1">${pengalaman}</div>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-900 p-1 mb-1.5">Pendidikan</h3>
                        <div class="text-[11px] text-slate-800 leading-relaxed space-y-1">${pendidikan}</div>
                    </div>
                    <div class="animate-fade-in">
                        <h3 class="text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-900 p-1 mb-1.5">Keahlian & Bahasa</h3>
                        <div class="text-[11px] text-slate-800 space-y-1">
                            <p><strong>Keahlian:</strong> ${skill}</p>
                            <p><strong>Bahasa:</strong> ${bahasa}</p>
                        </div>
                    </div>
                `;
            }
        }

        updateCV();
    </script>
</body>
</html>
